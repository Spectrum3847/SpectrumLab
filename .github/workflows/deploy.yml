# Deploys the site to Cloudflare Workers (static assets) on every push to master.
#
# Requires a repo secret CLOUDFLARE_API_TOKEN — create one at
# https://dash.cloudflare.com/profile/api-tokens with the "Edit Cloudflare
# Workers" template scoped to the Spectrum 3847 account, then add it under
# Settings → Secrets and variables → Actions.
name: Deploy to Cloudflare

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
